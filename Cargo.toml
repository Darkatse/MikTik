[package]
name = "miktik"
version = "0.4.3"
edition = "2024"
rust-version = "1.92"
description = "Tokenizers for LLMs: OpenAI encodings, Hugging Face tokenizer.json, SentencePiece and tiktoken rank files through one engine"
license = "MIT"
repository = "https://github.com/Darkatse/MikTik"
homepage = "https://github.com/Darkatse/MikTik"
documentation = "https://docs.rs/miktik"
readme = "README.md"
keywords = ["llm", "tokenizer", "tiktoken", "huggingface", "rust"]
categories = ["text-processing"]
include = ["/src", "/assets", "/tests", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = ["openai"]
openai = ["kitoken/convert-tiktoken"]
huggingface = ["kitoken/convert-tokenizers"]
sentencepiece = ["kitoken/convert-sentencepiece"]
tiktoken-bpe = ["kitoken/convert-tiktoken"]
full = ["openai", "huggingface", "sentencepiece", "tiktoken-bpe"]

[dependencies]
thiserror = "2"

[dependencies.kitoken]
version = "0.11.1"
default-features = false
features = ["std", "serialization", "normalization", "regex-perf", "regex-unicode", "multiversion"]

[dev-dependencies]
base64 = "0.22"
tiktoken-rs = "0.12"
