[package]
name = "miktik"
version = "0.5.1"
edition = "2024"
rust-version = "1.92"
description = "Exact token counts and fast estimates for LLM tokenizers: OpenAI encodings, Hugging Face tokenizer.json, SentencePiece and tiktoken files"
license = "MIT"
repository = "https://github.com/Darkatse/MikTik"
homepage = "https://github.com/Darkatse/MikTik"
documentation = "https://docs.rs/miktik"
readme = "README.md"
keywords = ["llm", "tokenizer", "tiktoken", "sentencepiece", "huggingface"]
categories = ["text-processing"]
include = ["/src", "/assets", "/tests", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[features]
default = ["openai"]
openai = ["kitoken/convert-tiktoken"]
huggingface = ["kitoken/convert-tokenizers"]
sentencepiece = ["kitoken/convert-sentencepiece"]
tiktoken-bpe = ["kitoken/convert-tiktoken"]
full = ["openai", "huggingface", "sentencepiece", "tiktoken-bpe"]
parallel = ["dep:rayon"]

[dependencies]
foldhash = { version = "0.2", default-features = false }
hashbrown = { version = "0.17", default-features = false }
rayon = { version = "1.10", optional = true }
thiserror = "2"

# Exact: artifacts hold kitoken's serialized definitions, and exact results and estimates are
# verified against this version. Upgrade it as AGENTS.md describes.
[dependencies.kitoken]
version = "=0.11.1"
default-features = false
features = ["std", "serialization", "normalization", "regex-perf", "regex-unicode", "multiversion"]

[dev-dependencies]
base64 = "0.22"
tiktoken-rs = "0.12"
