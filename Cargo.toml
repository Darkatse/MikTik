[package]
name = "miktik"
version = "0.4.1"
edition = "2024"
rust-version = "1.86"
description = "A unified, multi-backend tokenizer library for LLMs"
license = "MIT"
repository = "https://github.com/Darkatse/MikTik"
homepage = "https://github.com/Darkatse/MikTik"
documentation = "https://docs.rs/miktik"
readme = "README.md"
keywords = ["llm", "tokenizer", "tiktoken", "huggingface", "rust"]
categories = ["text-processing"]
exclude = [".local/**", "scripts/**", "tests/**", "Cargo.lock"]

[features]
default = ["openai"]
openai = ["dep:tiktoken-rs"]
huggingface = ["dep:kitoken", "kitoken/convert-tokenizers"]
sentencepiece = ["dep:kitoken", "kitoken/convert-sentencepiece"]
full = ["openai", "huggingface", "sentencepiece"]

[dependencies]
tiktoken-rs = { version = "0.12.0", optional = true }
thiserror = "2"

[dependencies.kitoken]
version = "0.11"
default-features = false
features = ["std", "normalization", "regex-perf", "multiversion"]
optional = true
